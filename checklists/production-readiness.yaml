# Curated checklist: the rules a service should meet before it takes production
# traffic. Rule ids point at rules/<category>/<slug>.md; order here is
# display order.
slug: production-readiness
version: 1
title: Production Readiness
description: Is this service ready for production traffic? Ownership, resilience, observability, security and deployment basics, checked against its design.
# Also a scorecard: every service gets a Level 0 to 3 on it. The level comes
# from each rule's priority (critical for Level 1, high for Level 2, medium for
# Level 3); the only thing set here is the level expected of each service tier,
# and the defaults (tier 1: Level 3, tier 2: Level 2, tier 3: Level 1) apply.
rating: {}
ruleIds:
  - ownership.team-set
  - ownership.oncall-set
  - ownership.runbook-present
  - api.endpoints-described
  - api.versioned-paths
  - api.idempotency-keys-on-create
  - events.published-have-schema
  - events.published-have-broker
  - events.publish-through-outbox
  - events.consumers-deduplicate
  - data.owned-data-declared
  - resilience.hard-deps-have-timeouts
  - resilience.hard-deps-fail-fast
  - resilience.retry-only-idempotent
  - observability.availability-slo
  - observability.latency-target
  - observability.traces-enabled
  - observability.alerts-defined
  - observability.dashboards-defined
  - security.authn-defined
  - security.authz-defined
  - security.secrets-in-store
  - security.pii-handling-documented
  - deployment.min-two-replicas
  - deployment.resource-limits
  - decisions.accepted-adr
